claims:
  - id: C1
    type: fact
    text: "The FAA proposed an AD for certain Boeing 787-8 airplanes involving potentially nonconforming material in large forward cargo-door split frames."
    status: supported
    evidence:
      - E1
  - id: C2
    type: fact
    text: "The proposal estimates four airplanes of U.S. registry for the inspection and estimates that replacement of all five split frames would cost $106,820 per product."
    status: supported
    evidence:
      - E1
  - id: C3
    type: inference
    text: "The Boeing bulletin's effectivity lists nine 787-8 line numbers, while the FAA's public cost estimate is expressly based on four airplanes of U.S. registry; the documents therefore use different stated scope bases."
    status: supported
    evidence:
      - E1
      - E4
  - id: C4
    type: fact
    text: "On 2026-08-20, the public FAA-2026-8784 docket API listed the NPRM as its only document and returned no attachments for that document."
    status: supported
    evidence:
      - E2
  - id: C5
    type: fact
    text: "On 2026-08-21, the FAA-2026-8784 docket API listed a supporting document whose PDF attachment metadata names the Boeing requirements bulletin."
    status: supported
    evidence:
      - E3
  - id: C6
    type: fact
    text: "Appendix A of the Boeing requirements bulletin lists affected delivered-part and detail-part batch numbers for the relevant LFCD split-frame assemblies."
    status: supported
    evidence:
      - E4
  - id: C7
    type: fact
    text: "The FAA registry records four valid U.S.-registered Boeing 787-8 aircraft with serial numbers 66003, 66004, 66005, and 66006, registered under N883BM, N884AA, N885BP, and N886BR respectively."
    status: supported
    evidence:
      - E6
  - id: C8
    type: inference
    text: "The four-airplane U.S.-registry cost base may correspond to four of the nine bulletin effectivity line numbers, but the public FAA registry records do not provide the line-number-to-serial crosswalk needed to prove that mapping from primary sources."
    status: provisional
    evidence:
      - E1
      - E4
      - E5
      - E6
