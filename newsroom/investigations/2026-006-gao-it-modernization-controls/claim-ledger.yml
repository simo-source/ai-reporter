claims:
  - id: C1
    type: fact
    text: "OIG-26-2 says GAO moved from a five-year modernization plan to an ongoing strategy less than 18 months after the plan was finalized, and the decision was undocumented."
    status: supported
    evidence:
      - E1
  - id: C2
    type: fact
    text: "OIG-26-2 says 39 of 61 modernization initiatives were complete as of May 2026, while some smaller initiatives were tracked under larger projects."
    status: supported
    evidence:
      - E1
  - id: C3
    type: fact
    text: "GAO's FY2024 performance plan described a four-year enterprise-content-management roadmap and set an 80% FY2024 target for an IT-tools measure against 56% actual performance in FY2022."
    status: supported
    evidence:
      - E2
  - id: C4
    type: fact
    text: "GAO's FY2025 performance report says resource constraints deferred high-priority IT hardware, intranet modernization, data analytics and AI, and identity-management work, while other applications continued."
    status: supported
    evidence:
      - E3
  - id: C5
    type: inference
    text: "The public records currently expose an initiative count, an older performance target, and broad resource-deferral categories, but do not yet reconcile individual initiative costs with measurable delivery outcomes."
    status: provisional
    evidence:
      - E1
      - E2
      - E3
  - id: C6
    type: fact
    text: "GAO's FY2026 performance plan describes ongoing cloud and network modernization, an enterprise-content-management replacement, nine automated workflow applications implemented in FY2024, and a planned shift to a new primary IT support contract in FY2025."
    status: supported
    evidence:
      - E4
  - id: C7
    type: inference
    text: "Even with concrete examples from the FY2026 plan, the public records do not show how those examples map to the OIG's 61 initiatives or to the approximately $29 million plan estimate."
    status: provisional
    evidence:
      - E1
      - E4
  - id: C8
    type: fact
    text: "GAO's FY2027 performance plan says FY2025 agency-wide IT rollouts included a new time-and-attendance system, enterprise-content-management system, operating system, and PIV cards; it also reports more than 95% of computing migrated to a cloud environment while further consolidation remained."
    status: supported
    evidence:
      - E5
  - id: C9
    type: fact
    text: "GAO's FY2026 budget request reports infrastructure-operations resources of $145.276 million in FY2024 actual, $112.857 million in the FY2025 operating plan, and $188.350 million requested for FY2026, while describing IT modernization, cloud data management and storage, and cybersecurity controls as internal needs."
    status: supported
    evidence:
      - E6
  - id: C10
    type: fact
    text: "GAO's June 2026 cloud-procurement audit says 22 of 24 selected agencies primarily relied on historical procurement data and that FPDS cloud data were not sufficiently precise for determining aggregate cloud spending, so GAO excluded obligated amounts from its analysis."
    status: supported
    evidence:
      - E7
  - id: C11
    type: inference
    text: "The new GAO plan and budget records add concrete rollouts and agency-wide resource totals but still do not provide a common identifier linking an initiative, its cost, and its milestone to the OIG's 61-initiative count."
    status: provisional
    evidence:
      - E1
      - E5
      - E6
  - id: C12
    type: fact
    text: "GAO's FY2022 budget request described an automated IT portfolio-management solution because the existing methods for planning, projecting, and tracking IT operations and investment costs relied on manual processes and disparate data sources."
    status: supported
    evidence:
      - E8
  - id: C13
    type: fact
    text: "GAO's March 2025 GAORFI0002 presolicitation sought industry input on an intranet modernization and cloud-hosting draft statement of work, but the displayed official record does not provide an award amount or completed-contract milestone."
    status: supported
    evidence:
      - E9
  - id: C14
    type: fact
    text: "GAO's FY2025 performance and accountability report says data-egress fees were about $7,300 for two cloud providers and describes one closed and one still-open OIG-25-1 cost-management recommendation."
    status: supported
    evidence:
      - E10
  - id: C15
    type: inference
    text: "The dated record now links a planned portfolio-tracking solution, a concrete modernization-related presolicitation, and a later cloud-cost control response, but still does not identify which of the 61 OIG initiatives received which cost or milestone."
    status: provisional
    evidence:
      - E1
      - E8
      - E9
      - E10
