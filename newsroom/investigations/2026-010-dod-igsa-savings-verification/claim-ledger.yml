claims:
  - id: C1
    type: fact
    text: "GAO reports 316 active intergovernmental support agreements as of December 2025, up from 45 in 2018."
    status: supported
    evidence:
      - E1
  - id: C2
    type: fact
    text: "GAO says the Navy, Marine Corps, and Air Force did not have procedures to verify actual IGSA costs and savings after agreements began."
    status: supported
    evidence:
      - E1
  - id: C3
    type: fact
    text: "10 U.S.C. § 2679(e) requires each Secretary concerned to make at least 25 percent of realized installation-level IGSA savings available to the installation commander and to certify specified amounts and uses annually to congressional defense committees."
    status: supported
    evidence:
      - E2
  - id: C4
    type: fact
    text: "DoD Instruction 4000.19 requires support-agreement cost information to be quantifiable, measurable, and reasonably attributable, and requires annual review of estimated costs for reimbursable support."
    status: supported
    evidence:
      - E3
  - id: C5
    type: inference
    text: "The relationship between GAO's reported verification gap and the statute's annual savings-recapture certification is unresolved until service-level certifications or agreement records are retrieved."
    status: provisional
    evidence:
      - E1
      - E2
      - E3
  - id: C6
    type: fact
    text: "Army Regulation 5-9 requires an IGSA cost-benefit analysis, approval documentation, periodic reporting, six-year record retention, and separate IGSA manager and technical-representative roles."
    status: supported
    evidence:
      - E4
  - id: C7
    type: fact
    text: "An official Army announcement says Fort Leonard Wood had nine active IGSAs in June 2026 and reports approximately $2.9 million in annual cost savings and cost avoidances across them."
    status: supported
    evidence:
      - E5
  - id: C8
    type: inference
    text: "The public Fort Leonard Wood announcement does not, on its face, provide the records needed to distinguish projected or avoided amounts from realized savings or to trace the statutory installation-level recapture."
    status: provisional
    evidence:
      - E2
      - E4
      - E5
  - id: C9
    type: fact
    text: "Army IMCOM guidance requires unique IGSA identifiers, GFEBS obligation and invoice records, supporting documentation, and periodic reconciliation of execution with that documentation."
    status: supported
    evidence:
      - E6
  - id: C10
    type: fact
    text: "An Army program page describes a Fort Bragg IGSA example in which invoices were validated and entered in GFEBS as miscellaneous payments, alongside a reported $486,000 in realized savings over the life of the agreements."
    status: supported
    evidence:
      - E7
  - id: C11
    type: fact
    text: "Fort Leonard Wood Garrison Policy 13 assigns agreement review, fiscal-viability determination, signatures, and central-repository retention to its local support-agreements process."
    status: supported
    evidence:
      - E8
  - id: C12
    type: inference
    text: "The Army has publicly described a traceable execution path for at least one older IGSA example, but the public record reviewed still does not connect Fort Leonard Wood's $2.9 million aggregate to agreement-level execution, realized savings, or the statutory installation-level amount."
    status: provisional
    evidence:
      - E2
      - E5
      - E6
      - E7
      - E8
