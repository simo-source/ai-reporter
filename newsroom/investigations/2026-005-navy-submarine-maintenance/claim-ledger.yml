claims:
  - id: C1
    type: fact
    text: "The CRS table reports 16 SSNs in depot maintenance or awaiting depot maintenance in FY2024, equal to 34% of the 47-boat force, with 31 operationally ready."
    status: supported
    evidence:
      - E1
  - id: C2
    type: fact
    text: "The CRS report says the Navy's stated industry-best-practice goal was about 20% of the SSN force in depot maintenance and none idle at a given moment."
    status: supported
    evidence:
      - E1
  - id: C3
    type: fact
    text: "The CRS report attributes the increase in SSNs in depot maintenance or idle primarily to insufficient workers and facility constraints at the four government-operated Naval Shipyards, with supply-chain issues as an additional issue."
    status: supported
    evidence:
      - E1
  - id: C4
    type: inference
    text: "The public record shows a measurable FY2024 gap between the reported 34% maintenance-or-idle level and the stated 20% benchmark, but it does not yet establish whether FY2026 investments changed that gap."
    status: provisional
    evidence:
      - E1
      - E2
  - id: C5
    type: fact
    text: "An April 22, 2026 CBO testimony reports that 33% of the Navy's SSN fleet was undergoing or awaiting maintenance, against a 20% goal, and describes a 48-boat force with at most 32 SSNs deployable."
    status: supported
    evidence:
      - E7
  - id: C6
    type: inference
    text: "The later CBO percentage and 48-boat force imply about 15.8 boats, consistent with the roughly 16-boat maintenance-or-awaiting-maintenance count CRS reported for FY2024, but rounding, dates, and differing source provenance prevent treating this as a precise Navy execution trend."
    status: provisional
    evidence:
      - E1
      - E7
  - id: C7
    type: fact
    text: "The Navy reported that USS John Warner (SSN 785) undocked in March 2026 and had more than 95% of production work complete, with testing, crew readiness, and sea trials remaining."
    status: supported
    evidence:
      - E8
  - id: C8
    type: inference
    text: "The John Warner milestone demonstrates progress on one Virginia-class availability but cannot establish a post-April fleet-level change against the 20% benchmark."
    status: provisional
    evidence:
      - E1
      - E7
      - E8
  - id: C9
    type: fact
    text: "GAO reports more than 15,000 lost operational days during FY2016–FY2025 and projects more than 14,000 inactive-idle days and $3.1 billion in support costs for 15 attack submarines entering inactive idle during FY2026–FY2030 without mitigation."
    status: supported
    evidence:
      - E9
  - id: C10
    type: inference
    text: "GAO's operational-day series and projection add a separate readiness-cost dimension, but they cannot be treated as a precise continuation of the CRS or CBO fleet-share measure."
    status: provisional
    evidence:
      - E1
      - E7
      - E9
